<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#7fd3f7">
  <title>Rotterdam Stamp Rally</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="map"></div>

  <header class="hud">
    <div class="hud__progress"><span aria-hidden="true">🏅</span><span id="progress">0/0</span></div>
    <p id="status" class="hud__status">Finding your location…</p>
    <button id="testToggle" class="test-toggle" aria-pressed="false">🛠️ Test</button>
  </header>

  <button id="reset" class="reset" hidden>↺ Reset stamps</button>
  <button id="collect" class="collect" hidden></button>
  <button id="bookToggle" class="fab" aria-label="Stamp book">📖</button>

  <section id="sheet" class="sheet" hidden>
    <div class="sheet__head">
      <h2>Stamp book</h2>
      <button id="sheetClose" class="sheet__close" aria-label="Close">✕</button>
    </div>
    <ul id="book" class="book"></ul>
  </section>

  <div id="toast" class="toast" hidden></div>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
