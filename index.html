<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14171c">
  <title>Citiverse Rotterdam</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="map"></div>

  <header class="hud">
    <p id="status" class="status">Locatie zoeken…</p>
    <div class="hud__tools">
      <button id="testToggle" class="chip-btn" aria-pressed="false">Test</button>
      <button id="reset" class="chip-btn" hidden>Reset</button>
    </div>
  </header>

  <button id="collect" class="collect" hidden></button>
  <button id="bookToggle" class="dock" aria-label="Stempelboek">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5zM4 20.5A2.5 2.5 0 0 0 6.5 23H20v-5"/><circle cx="12" cy="10.5" r="3.5"/></svg>
    <span>Stempelboek</span>
  </button>

  <section id="sheet" class="sheet" hidden>
    <div class="sheet__grip" aria-hidden="true"></div>
    <div class="sheet__head">
      <div>
        <h2>Stempelboek</h2>
        <p id="sheetCount" class="sheet__count"></p>
      </div>
      <button id="sheetClose" class="sheet__close" aria-label="Sluiten">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <ul id="book" class="cards"></ul>
    <details class="credits">
      <summary>Fotobronnen</summary>
      <ul id="credits"></ul>
      <p>Foto's van Wikimedia Commons, bijgesneden en verkleind.</p>
    </details>
  </section>

  <div id="toast" class="toast" hidden></div>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
